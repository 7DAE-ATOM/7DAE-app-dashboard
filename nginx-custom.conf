map $sent_http_content_type $expires_policy {
    default                    off;
    ~image/                    7d;
    ~font/                     30d;
    application/javascript     30d;
    text/css                   30d;
}

server {
    listen       $SERVER_PORT;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;

    # Behind the AFTER gateway (TLS on 443 → pod on 8080), nginx must NOT build
    # absolute redirects: it only knows its internal listen port (8080) and would
    # emit `Location: https://host:8080/...`, leaking a port the gateway doesn't
    # expose. Relative redirects let the browser keep the external scheme/host/port.
    # This matters for the directory trailing-slash 301 on `/atom-app-dashboard`
    # (the Next.js basePath home link, e.g. the Airbus logo).
    absolute_redirect off;
    port_in_redirect  off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript
               text/xml application/xml text/javascript image/svg+xml font/ttf font/otf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    expires $expires_policy;

    # K8s liveness/readiness probe — matches both /health and /basepath/health
    location ~ /health$ {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # The Next.js basePath home link (e.g. the Airbus logo) points to
    # `/atom-app-dashboard` WITHOUT a trailing slash. That path maps to a
    # directory on disk, so nginx would normally answer with a 301 adding the
    # slash — and behind the AFTER gateway that 301 leaks the internal :8080
    # port (`https://host:8080/atom-app-dashboard/`), which is not exposed.
    # An EXACT-match location (highest priority) serves index.html directly with
    # a 200, so no redirect is ever produced. Keep this path in sync with the
    # Dockerfile COPY target and the Next.js basePath.
    location = /atom-app-dashboard {
        try_files /atom-app-dashboard/index.html =404;
    }

    # SPA routing — Next.js static export. The detail view is a single static
    # page (/labtestmean.html) that reads ?id= client-side, so no special rule
    # is needed for it.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Immutable cache for hashed JS/CSS/font/image assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "private, no-cache, no-store, must-revalidate";
        add_header Expires "Sat, 01 Jan 2000 00:00:00 GMT";
        add_header Pragma no-cache;
    }
}
